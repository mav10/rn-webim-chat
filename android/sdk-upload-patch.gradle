import java.security.MessageDigest
import java.util.zip.ZipFile

configurations.create('webimUploadPatchSources') { transitive = false }
dependencies.add('webimUploadPatchSources', 'ru.webim.sdk:webimclientsdkandroid:4.1.4:sources@jar')
def patchedSources = layout.buildDirectory.dir('generated/sources/webimUploadPatch')
def generatePatch = tasks.register('generateWebimUploadPatch') {
  inputs.files(configurations.webimUploadPatchSources)
  inputs.file(file('sdk-upload-patch.gradle'))
  inputs.file(file('sdk-artifact-transform.gradle'))
  outputs.dir(patchedSources)
  doLast {
    File archive = configurations.webimUploadPatchSources.singleFile
    String digest = MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString()
    if (digest != 'd41779f4f71bb5a86109e2862b38d813e27a249253b055dedc69fb0925c5265d') {
      throw new GradleException('Webim source checksum changed; review upload patch')
    }
    new ZipFile(archive).withCloseable { input ->
      def readSource = { String path ->
        def entry = input.getEntry(path)
        if (entry == null) throw new GradleException("Missing Webim source: ${path}")
        input.getInputStream(entry).withCloseable { it.getText('UTF-8') }
      }
      def writeSource = { String path, String source ->
        File target = new File(patchedSources.get().asFile, path)
        target.parentFile.mkdirs()
        target.setText(source, 'UTF-8')
      }
      String urlPath = 'ru/webim/android/sdk/impl/FileUrlCreator.java'
      String urlSource = readSource(urlPath)
      String urlCondition = 'safeUrlEnabled != null && safeUrlEnabled && client.getAuthData() != null'
      if (urlSource.count(urlCondition) != 1) throw new GradleException('Webim file URL signing changed; review media patch')
      writeSource(urlPath, urlSource.replace(urlCondition, 'client.getAuthData() != null'))

      String streamPath = 'ru/webim/android/sdk/impl/MessageStreamImpl.java'
      String source = readSource(streamPath)
      String original = 'UploadedFile uploadedFile = InternalUtils.getUploadedFile(response);\n                            uploadFileToServerCallback.onSuccess(id, uploadedFile);'
      if (source.count(original) != 1) throw new GradleException('Webim upload callback changed; review upload patch')
      String replacement = 'com.rnwebimchat.SafeUploadedFileResponse.deliver(response, id, uploadFileToServerCallback);'
      source = source.replace(original, replacement)
      int uploadStart = source.indexOf('public Message.Id uploadFileToServer(')
      int uploadCall = source.indexOf('actions.sendFile(', uploadStart)
      int uploadCallback = source.indexOf(replacement, uploadStart)
      if (uploadStart < 0 || uploadCall < uploadStart || uploadCall > uploadCallback) {
        throw new GradleException('Webim stream upload routing changed; review upload patch')
      }
      source = source.substring(0, uploadCall) + 'actions.uploadFileToServer(' +
        source.substring(uploadCall + 'actions.sendFile('.length())
      writeSource(streamPath, source)

      String interfacePath = 'ru/webim/android/sdk/impl/backend/WebimActions.java'
      String actions = readSource(interfacePath)
      String declaration = '''    void sendFile(@NonNull RequestBody body,
                  @NonNull String filename,
                  @NonNull String clientSideId,
                  @Nullable SendOrDeleteMessageInternalCallback callback);'''
      if (actions.count(declaration) != 1) throw new GradleException('Webim sendFile declaration changed; review upload patch')
      writeSource(interfacePath, actions.replace(declaration,
        declaration + '\n\n' + declaration.replace('void sendFile(', 'void uploadFileToServer(')))

      String backendPath = 'ru/webim/android/sdk/impl/backend/WebimActionsImpl.java'
      String backend = readSource(backendPath)
      String methodStart = '    @Override\n    public void sendFile('
      String methodEnd = '    @Override\n    public void deleteUploadedFile('
      int start = backend.indexOf(methodStart)
      int end = backend.indexOf(methodEnd, start)
      if (start < 0 || end < start) throw new GradleException('Webim backend upload method changed; review upload patch')
      String sendFile = backend.substring(start, end)
      String guidCallback = 'callback.onSuccess(response.getData().getGuid());'
      if (sendFile.count(guidCallback) != 1) throw new GradleException('Webim GUID callback changed; review upload patch')
      String uploadFile = sendFile.replace('public void sendFile(', 'public void uploadFileToServer(')
        .replace(guidCallback, 'callback.onSuccess(ru.webim.android.sdk.impl.InternalUtils.toJson(response.getData()));')
      writeSource(backendPath, backend.substring(0, end) + uploadFile + backend.substring(end))
    }
  }
}
android.sourceSets.main.java.srcDir(patchedSources.get().asFile)
tasks.named('preBuild').configure { dependsOn(generatePatch) }
dependencies.add('testImplementation', 'junit:junit:4.13.2')